services:
  - type: web
    name: orbitguard-backend
    runtime: python
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHONPATH
        value: .
      - key: DATABASE_URL
        value: sqlite:///./data/orbitguard.db
      - key: ORBITAL_DATA_PROVIDER
        value: Space-Track
